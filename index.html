<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAR Decoder v0.1</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>METAR Decoder</h1>
            <p>Автоматичне декодування авіаційних метеорологічних повідомлень</p>
            <span class="version">v0.1</span>
        </header>

        <section class="decoder">

            <label for="metarInput">Введіть METAR:</label>

            <textarea
                id="metarInput"
                rows="3"
                placeholder="Наприклад: UKBB 161500Z 25006MPS 9999 SCT030 18/12 Q1018 NOSIG"
            ></textarea>

            <div class="buttons">
                <button id="decodeButton">Decode METAR</button>
                <button id="clearButton" type="button">Clear</button>
            </div>

        </section>

        <section id="result" class="result">

            <h2>Результат декодування</h2>

            <div id="status" class="status">
                Введіть METAR та натисніть «Decode METAR».
            </div>

            <div id="decodedData" class="decoded-data"></div>

        </section>

        <footer class="footer">
            <p>
                METAR Decoder v0.1 —
                open-source project
            </p>
        </footer>

    </main>

    <script src="js/metar-parser.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
